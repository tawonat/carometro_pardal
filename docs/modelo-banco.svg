<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="900" viewBox="0 0 1220 900"><rect width="1220" height="900" rx="20" fill="#f7f8f3"/><style>text{font-family:Arial,sans-serif}.title{font-weight:700;font-size:24px;fill:#254a3e}.heading{font-weight:700;font-size:17px;fill:white}.row{font-size:13px;fill:#4f6256}.small{font-size:12px;fill:#7c8b7d}.line{stroke:#9cac94;stroke-width:2;fill:none}</style><text x="40" y="48" class="title">Elo — Modelo relacional · MySQL</text><rect x="40" y="90" width="315" height="252" rx="12" fill="white" stroke="#dde5d6"/><path d="M52 90H343Q355 90 355 102V132H40V102Q40 90 52 90" fill="#315445"/><text x="57" y="117" class="heading">classes</text><text x="57" y="156" class="row">PK  id · INT UNSIGNED</text><text x="57" y="181" class="row">name · VARCHAR(60)</text><text x="57" y="206" class="row">course · VARCHAR(100)</text><text x="57" y="231" class="row">school_year · SMALLINT</text><text x="57" y="256" class="row">shift · ENUM</text><text x="57" y="281" class="row">room · VARCHAR(30)</text><text x="57" y="306" class="row">created_at / updated_at</text><text x="57" y="331" class="row">UNIQUE (name, school_year, shift)</text><rect x="450" y="90" width="320" height="302" rx="12" fill="white" stroke="#dde5d6"/><path d="M462 90H758Q770 90 770 102V132H450V102Q450 90 462 90" fill="#315445"/><text x="467" y="117" class="heading">students</text><text x="467" y="156" class="row">PK  id · INT UNSIGNED</text><text x="467" y="181" class="row">UK  enrollment · VARCHAR(12)</text><text x="467" y="206" class="row">full_name · VARCHAR(120)</text><text x="467" y="231" class="row">preferred_name · VARCHAR(60)</text><text x="467" y="256" class="row">email · VARCHAR(160)</text><text x="467" y="281" class="row">FK  class_id → classes.id</text><text x="467" y="306" class="row">status · ENUM</text><text x="467" y="331" class="row">bio · VARCHAR(280)</text><text x="467" y="356" class="row">avatar_key · TINYINT [1..12]</text><text x="467" y="381" class="row">created_at / updated_at</text><rect x="870" y="90" width="310" height="127" rx="12" fill="white" stroke="#dde5d6"/><path d="M882 90H1168Q1180 90 1180 102V132H870V102Q870 90 882 90" fill="#315445"/><text x="887" y="117" class="heading">student_photos</text><text x="887" y="156" class="row">PK/FK  student_id → students.id</text><text x="887" y="181" class="row">image_data · MEDIUMBLOB</text><text x="887" y="206" class="row">Formato normalizado: WebP</text><rect x="40" y="535" width="315" height="177" rx="12" fill="white" stroke="#dde5d6"/><path d="M52 535H343Q355 535 355 547V577H40V547Q40 535 52 535" fill="#315445"/><text x="57" y="562" class="heading">users</text><text x="57" y="601" class="row">PK  id · INT UNSIGNED</text><text x="57" y="626" class="row">name · VARCHAR(100)</text><text x="57" y="651" class="row">UK  email · VARCHAR(160)</text><text x="57" y="676" class="row">password_hash · VARCHAR(255)</text><text x="57" y="701" class="row">created_at · TIMESTAMP</text><rect x="450" y="535" width="320" height="127" rx="12" fill="white" stroke="#dde5d6"/><path d="M462 535H758Q770 535 770 547V577H450V547Q450 535 462 535" fill="#315445"/><text x="467" y="562" class="heading">sessions</text><text x="467" y="601" class="row">PK  token_hash · CHAR(64)</text><text x="467" y="626" class="row">FK  user_id → users.id</text><text x="467" y="651" class="row">expires_at · DATETIME</text><rect x="870" y="535" width="310" height="177" rx="12" fill="white" stroke="#dde5d6"/><path d="M882 535H1168Q1180 535 1180 547V577H870V547Q870 535 882 535" fill="#315445"/><text x="887" y="562" class="heading">login_attempts</text><text x="887" y="601" class="row">PK  email_hash · CHAR(64)</text><text x="887" y="626" class="row">attempts · INT UNSIGNED</text><text x="887" y="651" class="row">window_start · DATETIME</text><text x="887" y="676" class="row">Independente: inclui e-mails</text><text x="887" y="701" class="row">ainda não cadastrados.</text><path class="line" d="M355 188H450"/><text x="366" y="174" class="small">1</text><text x="423" y="174" class="small">N</text><text x="368" y="210" class="small">RESTRICT</text><path class="line" d="M770 175H870"/><text x="781" y="160" class="small">1</text><text x="832" y="160" class="small">0..1</text><text x="784" y="197" class="small">CASCADE</text><path class="line" d="M355 620H450"/><text x="366" y="606" class="small">1</text><text x="423" y="606" class="small">N</text><text x="368" y="642" class="small">CASCADE</text><text x="40" y="818" class="small">PK: chave primária · FK: chave estrangeira · UK: valor único. Relações: turma 1:N alunos; aluno 1:0..1 foto; usuário 1:N sessões.</text><text x="40" y="845" class="small">Campos obrigatórios e regras completas: database/schema.sql. Instalação automática: npm run db:setup.</text></svg>