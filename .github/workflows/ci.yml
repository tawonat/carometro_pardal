name: Verificações do Elo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar configuração de teste descartável
        run: |
          cp .env.example .env
          echo 'DB_ADMIN_PASSWORD=test_root_password' >> .env
      - run: npm run db:setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Executar integração HTTP com MySQL
        run: |
          npm start > /tmp/elo-server.log 2>&1 &
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/login > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'Servidor não iniciou'; exit 1; fi
          npm run test:integration
